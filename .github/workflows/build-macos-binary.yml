name: Build macOS Unix binaries

on:
  workflow_dispatch:
  push:
    branches:
      - local-patches
    paths:
      - .github/workflows/build-macos-binary.yml

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: macos-arm64
            deployment_target: "11.0"
          - target: x86_64-apple-darwin
            name: macos-x64
            deployment_target: "10.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run frontend:build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Build embedded frontend and backend binary
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: cargo build --release --target ${{ matrix.target }} -p server --bin server

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          install -m 755 "target/${{ matrix.target }}/release/server" package/openteams
          codesign --force --sign - package/openteams
          tar -C package -czf "openteams-${{ matrix.name }}.tar.gz" openteams

      - name: Upload executable archive
        uses: actions/upload-artifact@v6
        with:
          name: openteams-${{ matrix.name }}
          path: openteams-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 14
